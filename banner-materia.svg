<svg width="950" height="300" viewBox="0 0 950 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081B33"/>
      <stop offset="50%" stop-color="#0E2C52"/>
      <stop offset="100%" stop-color="#123A6B"/>
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A2647"/>
      <stop offset="100%" stop-color="#173F73"/>
    </linearGradient>
  </defs>

  <rect width="950" height="300" rx="16" fill="url(#bgGradient)"/>

  <path d="M0,270 C 200,290 350,255 500,270 C 650,285 800,260 950,275 L950,300 L0,300 Z"
