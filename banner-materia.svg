  </text>

  <text x="475" y="122" text-anchor="middle"
        font-family="Segoe UI, Verdana, sans-serif" font-weight="700"
        font-size="27" fill="#EFB94A">
    Exercícios da lista do professor
  </text>

  <text x="475" y="158" text-anchor="middle"
        font-family="Segoe UI, Verdana, sans-serif" font-weight="700"
        font-size="22" fill="#EFB94A">
    2° SEMESTRE ENGENHARIA DE SOFTWARE
  </text>

  <text x="475" y="205" text-anchor="middle"
        font-family="Segoe UI, Verdana, sans-serif" font-weight="400"
